spring.application.name=tauche

# Database Configuration - Use DB_URL if provided, otherwise fallback to individual variables
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:tauche}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.address=0.0.0.0
server.port=${PORT:8080}

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# JWT Secret (required for authentication)
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production}

# CORS Allowed Origins
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
