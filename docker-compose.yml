version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tauche-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dive_master}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_reef_password}
      POSTGRES_DB: ${POSTGRES_DB:-divelog_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tauche-network
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: swissschoggi/tauche:latest
    container_name: tauche-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8989}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-divelog_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dive_master}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secure_reef_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - tauche-network

volumes:
  postgres_data:

networks:
  tauche-network:
    driver: bridge
